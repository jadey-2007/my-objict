<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带倒计时的登录界面</title>
    <style>
        /* --- 全局样式 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); /* 漂亮的渐变背景 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- 导航栏样式 (Flexbox 均匀分布) --- */
        .navbar {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            margin: 20px 0;
            padding: 10px;
            display: flex;
            justify-content: space-around; /* 均匀分布 */
            align-items: center;
        }

        .nav-item {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .nav-item:hover {
            background-color: #f0f0f0;
            color: #667eea;
        }

        /* --- 登录卡片 --- */
        .login-container {
            background-color: #fff;
            width: 400px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
            text-align: center;
        }

        .login-title {
            font-size: 24px;
            margin-bottom: 30px;
            color: #333;
        }

        /* 表单输入框样式 */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        /* 验证码按钮样式 */
        #sendCodeBtn {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        #sendCodeBtn:hover {
            background-color: #5568d0;
        }

        /* 登录按钮 */
        .btn-login {
            background-color: #28a745;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-login:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <nav class="navbar">
        <a href=" " class="nav-item">首页</a >
        <a href="#" class="nav-item">产品</a >
        <a href="#" class="nav-item">服务</a >
        <a href="#" class="nav-item">关于我们</a >
    </nav>

    <!-- 登录表单 -->
    <div class="login-container">
        <h2 class="login-title">用户登录</h2>

        <form id="loginForm">
            <!-- 手机号输入 -->
            <div class="form-group">
                <label for="phone">手机号：</label>
                <input type="text" id="phone" placeholder="请输入手机号" maxlength="11">
            </div>

            <!-- 验证码输入 -->
            <div class="form-group">
                <label for="code">验证码：</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="code" placeholder="请输入验证码" style="flex: 1;">
                    <!-- 按钮 -->
                    <button type="button" id="sendCodeBtn" onclick="startCountdown()">发送验证码</button>
                </div>
            </div>

            <!-- 登录按钮 -->
            <button type="button" class="btn-login" onclick="login()">登录</button>
        </form>
    </div>

    <script>
        // JS 交互逻辑

        // 1. 定时器相关变量
        let countdown = 60;
        let timer = null;
        const btn = document.getElementById('sendCodeBtn');

        // 2. 倒计时函数
        function startCountdown() {
            // 简单的防重点击：如果定时器正在运行，不允许再次点击
            if (timer) return;

            // 模拟发送请求（实际项目中这里会调用后端接口）
            console.log("正在发送验证码...");

            // 禁用按钮并改变样式
            btn.disabled = true;
            btn.style.backgroundColor = "#ccc";
            btn.style.cursor = "not-allowed";

            // 启动定时器
            timer = setInterval(() => {
                countdown--;
                // 更新按钮文字
                btn.innerText = `重新发送 (${countdown}s)`;

                // 倒计时结束
                if (countdown <= 0) {
                    clearInterval(timer);
                    timer = null; // 重置定时器状态
                    countdown = 60; // 重置秒数

                    // 恢复按钮
                    btn.disabled = false;
                    btn.style.backgroundColor = ""; // 恢复默认颜色
                    btn.style.cursor = "pointer";
                    btn.innerText = "发送验证码";
                }
            }, 1000);
        }

        // 3. 模拟登录函数
        function login() {
            const phone = document.getElementById('phone').value;
            const code = document.getElementById('code').value;

            if (!phone || !code) {
                alert("手机号或验证码不能为空！");
                return;
            }

            // 这里可以添加实际的登录逻辑（如 fetch 请求）
            alert("登录成功！\n手机号: " + phone + "\n验证码: " + code);
        }
    </script>
</body>
</html>
